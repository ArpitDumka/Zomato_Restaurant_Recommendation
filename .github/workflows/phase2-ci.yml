name: Phase 2 CI

on:
  push:
    paths:
      - "phase2/**"
      - ".github/workflows/phase2-ci.yml"
  pull_request:
    paths:
      - "phase2/**"
      - ".github/workflows/phase2-ci.yml"

jobs:
  phase2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (editable) + dev tools
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest (Hugging Face Hub)
        run: pytest
