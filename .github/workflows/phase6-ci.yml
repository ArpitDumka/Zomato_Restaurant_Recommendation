name: Phase 6 CI

on:
  push:
    paths:
      - "phase6/**"
      - ".github/workflows/phase6-ci.yml"
  pull_request:
    paths:
      - "phase6/**"
      - ".github/workflows/phase6-ci.yml"

jobs:
  phase6:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install phases 2-5
        run: |
          pip install -e "../phase2"
          pip install -e "../phase3"
          pip install -e "../phase4"
          pip install -e "../phase5"
      - name: Install phase6 + dev
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest
