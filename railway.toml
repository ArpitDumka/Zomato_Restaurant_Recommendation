# Railway config-as-code — must match Docs/Deployment.md
# https://docs.railway.com/deploy/config-as-code
#
# Service root: repository root (requirements.txt + this file).
# Set variables in Railway → your service → Variables (see railway.env.example).

[build]
builder = "RAILPACK"
buildCommand = "pip install --upgrade pip && pip install -r requirements.txt"

[deploy]
startCommand = "uvicorn zomato_surface.app:create_app --factory --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
# Seconds to wait for /api/health to return 200 after the process starts (slow networks / cold regions).
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
